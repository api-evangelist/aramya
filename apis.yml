name: Aramya
description: 'Aramya is a direct-to-consumer (D2C) women''s ethnic wear brand from India, operated by
  DSLR Technologies Pvt. Ltd. and based in Jaipur, Rajasthan. Founded by Ankush Goyal, Aramya sells premium
  cotton kurtas, kurta sets, bottoms, dresses, co-ord sets, and dupattas with a strong focus on inclusive
  sizing (XS to 10XL) and affordable, comfortable everyday, office, and occasion wear. The brand runs on a
  Shopify-based storefront at aramya.in with weekly launches, cash on delivery, and free returns, and has
  raised multiple rounds (seed, pre-Series A, and an ~INR 80 Cr Series A) co-led by Accel India and Z47
  (formerly Matrix Partners India). Aramya is a consumer retail brand and does not publish a public developer
  API; it does publish an llms.txt describing its shopping surface for AI assistants.'
